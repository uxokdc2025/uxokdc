<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0B06" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1A0B06" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="screen"><rect width="1200" height="750" rx="0"/></clipPath>
  </defs>

  <!-- Background: forest/dark hero -->
  <rect width="1200" height="750" fill="#2C1A0E"/>
  <!-- Forest texture suggestion -->
  <rect x="0" y="0" width="1200" height="500" fill="#1A0B06" opacity="0.6"/>
  <rect x="200" y="60" width="30" height="420" fill="#0D2010" rx="4" opacity="0.4"/>
  <rect x="280" y="20" width="22" height="460" fill="#0D2010" rx="4" opacity="0.5"/>
  <rect x="350" y="40" width="18" height="430" fill="#0D2010" rx="4" opacity="0.35"/>
  <rect x="500" y="10" width="28" height="490" fill="#0A1A0C" rx="4" opacity="0.45"/>
  <rect x="620" y="50" width="20" height="410" fill="#0A1A0C" rx="4" opacity="0.4"/>
  <rect x="780" y="30" width="24" height="450" fill="#0D2010" rx="4" opacity="0.38"/>
  <rect x="900" y="15" width="32" height="470" fill="#0D2010" rx="4" opacity="0.42"/>
  <rect x="1050" y="55" width="19" height="400" fill="#0A1A0C" rx="4" opacity="0.36"/>

  <!-- Overlay gradient -->
  <rect width="1200" height="750" fill="url(#hero-grad)"/>

  <!-- NAV -->
  <rect width="1200" height="52" fill="#1A0B06" opacity="0.92"/>
  <!-- TintoProps logo -->
  <text x="32" y="34" font-family="Georgia, serif" font-weight="700" font-size="18" fill="#F5F0EA">Tinto<tspan fill="#D94E1F">Props</tspan></text>
  <!-- + Adviser badge -->
  <rect x="168" y="18" width="72" height="22" rx="11" fill="none" stroke="#D94E1F" stroke-width="1"/>
  <text x="204" y="33" font-family="Arial,sans-serif" font-size="11" fill="#D94E1F" text-anchor="middle">+ Adviser</text>
  <!-- Nav links -->
  <text x="560" y="34" font-family="Arial,sans-serif" font-size="13" fill="#F5F0EA" text-anchor="middle">Buy</text>
  <line x1="539" y1="46" x2="581" y2="46" stroke="#D94E1F" stroke-width="2"/>
  <text x="660" y="34" font-family="Arial,sans-serif" font-size="13" fill="#9A8A7A" text-anchor="middle">Rent</text>
  <text x="750" y="34" font-family="Arial,sans-serif" font-size="13" fill="#9A8A7A" text-anchor="middle">Projects</text>
  <!-- COP/USD toggle -->
  <rect x="1068" y="14" width="42" height="24" rx="12" fill="#D94E1F"/>
  <text x="1089" y="30" font-family="Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">COP</text>
  <rect x="1113" y="14" width="42" height="24" rx="12" fill="none" stroke="#555" stroke-width="1"/>
  <text x="1134" y="30" font-family="Arial,sans-serif" font-size="10" fill="#9A8A7A" text-anchor="middle">USD</text>

  <!-- Hero text block -->
  <text x="360" y="175" font-family="Arial,sans-serif" font-size="11" fill="#D94E1F" letter-spacing="2" text-anchor="middle">WELCOME TO TINTO PROPS.</text>
  <text x="360" y="240" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="52" fill="#F5F0EA" text-anchor="middle">Your next home in</text>
  <text x="360" y="300" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="52" fill="#F5F0EA" text-anchor="middle">Cali.</text>

  <!-- Stats row -->
  <text x="260" y="355" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#F5F0EA">1,100</text>
  <text x="260" y="372" font-family="Arial,sans-serif" font-size="10" fill="#9A8A7A">for sale</text>
  <text x="340" y="355" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#F5F0EA">540+</text>
  <text x="340" y="372" font-family="Arial,sans-serif" font-size="10" fill="#9A8A7A">for rent</text>
  <text x="420" y="355" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#F5F0EA">+6.5%</text>
  <text x="420" y="372" font-family="Arial,sans-serif" font-size="10" fill="#9A8A7A">annual appreciation</text>

  <!-- Search bar -->
  <rect x="195" y="385" width="340" height="44" rx="8" fill="#F5F0EA"/>
  <text x="220" y="402" font-family="Arial,sans-serif" font-size="9" fill="#9A8A7A">City</text>
  <text x="220" y="418" font-family="Arial,sans-serif" font-size="13" fill="#1A0B06">Cali</text>
  <line x1="320" y1="390" x2="320" y2="425" stroke="#D8D6D0" stroke-width="1"/>
  <text x="335" y="402" font-family="Arial,sans-serif" font-size="9" fill="#9A8A7A">Type</text>
  <text x="335" y="418" font-family="Arial,sans-serif" font-size="13" fill="#1A0B06">Buy</text>
  <line x1="408" y1="390" x2="408" y2="425" stroke="#D8D6D0" stroke-width="1"/>
  <text x="423" y="402" font-family="Arial,sans-serif" font-size="9" fill="#9A8A7A">Budget</text>
  <text x="423" y="418" font-family="Arial,sans-serif" font-size="13" fill="#9A8A7A">Any budget</text>
  <!-- Search button -->
  <rect x="542" y="385" width="80" height="44" rx="8" fill="#D94E1F"/>
  <text x="582" y="412" font-family="Arial,sans-serif" font-weight="600" font-size="13" fill="#fff" text-anchor="middle">Search</text>

  <!-- Bottom section: light bg + Explore by city -->
  <rect x="0" y="480" width="1200" height="270" fill="#F5F0EA"/>
  <text x="360" y="525" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#1A0B06" text-anchor="middle">Explore by city</text>
  <text x="360" y="543" font-family="Arial,sans-serif" font-size="11" fill="#9A8A7A" text-anchor="middle">Live inventory from the MLS, updated daily.</text>

  <!-- City cards row 1 -->
  <rect x="100" y="558" width="160" height="100" rx="10" fill="#8B7355"/>
  <rect x="100" y="558" width="160" height="100" rx="10" fill="#000" opacity="0.3"/>
  <text x="115" y="638" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">Bogotá</text>
  <text x="115" y="652" font-family="Arial,sans-serif" font-size="10" fill="#ddd">3,550 listings</text>

  <rect x="275" y="558" width="160" height="100" rx="10" fill="#C4A882"/>
  <rect x="275" y="558" width="160" height="100" rx="10" fill="#000" opacity="0.3"/>
  <text x="290" y="638" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">Medellín</text>
  <text x="290" y="652" font-family="Arial,sans-serif" font-size="10" fill="#ddd">2,830 listings</text>

  <rect x="450" y="558" width="160" height="100" rx="10" fill="#5A7A8A"/>
  <rect x="450" y="558" width="160" height="100" rx="10" fill="#000" opacity="0.3"/>
  <text x="465" y="638" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">Cartagena</text>
  <text x="465" y="652" font-family="Arial,sans-serif" font-size="10" fill="#ddd">1,060 listings</text>
</svg>
